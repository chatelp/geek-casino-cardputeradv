; Geek Casino — trois environnements : firmware, simulateur macOS, tests natifs.
; Voir CLAUDE.md pour l'architecture et les pièges matériels.

[platformio]
default_envs = sim

[env]
build_flags = -Wall -Wextra

; ---------------------------------------------------------------- firmware
[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = m5stack-stamps3
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unified
    m5stack/M5GFX
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
monitor_speed = 115200

; ------------------------------------------------------- simulateur macOS
; LovyanGFX + SDL2 (Panel_sdl), même API lgfx:: que M5GFX.
[env:sim]
platform = native
lib_deps = lovyan03/LovyanGFX@^1.2.0
lib_compat_mode = off
build_type = debug
build_flags =
    ${env.build_flags}
    -std=c++17
    -DSIM_BUILD
    -DLGFX_USE_V1
    -DLGFX_SDL
    -I/opt/homebrew/include
    -L/opt/homebrew/lib
    -lSDL2

; --------------------------------------------------------- tests natifs
; Ne teste que lib/core (logique pure). Les mains de src/ sont vides ici
; (gardes #ifdef ARDUINO / SIM_BUILD).
[env:test-native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=c++17
